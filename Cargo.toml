[package]
name = "spotify-cli"
version = "0.1.0"
edition = "2021"
description = "A personal Spotify remote, terminal interface, and weekly music diary"
license = "MIT"
repository = "https://github.com/ericseppanen999/spotify-cli"

[[bin]]
name = "spot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
oauth2 = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
